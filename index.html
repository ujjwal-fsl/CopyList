<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copy List Items</title>
<style>
  body { font-family: sans-serif; background: #f5f5f5; padding: 2rem; }
  textarea { width: 100%; height: 120px; padding: 10px; font-size: 1rem; }
  button { margin: 5px 0; padding: 8px 12px; border: none; border-radius: 8px; background: #007bff; color: white; cursor: pointer; }
  button:hover { background: #0056b3; }
  .item { position: relative; display: flex; align-items: center; justify-content: space-between; background: white; margin: 4px 0; padding: 10px; border-radius: 6px; }
  .popup {
    position: absolute;
    bottom: 45px;
    right: 10px;
    background: #333;
    color: #fff;
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 0.8rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease, transform 0.4s ease;
    transform: translateY(5px);
  }
  .popup.show {
    opacity: 1;
    transform: translateY(0);
  }
</style>
</head>
<body>
<h2>Paste Your List</h2>
<textarea id="input"></textarea><br>
<button onclick="generate()">Generate Copy Buttons</button>
<div id="output"></div>

<script>
function generate() {
  const output = document.getElementById('output');
  output.innerHTML = '';
  const lines = document.getElementById('input').value.split('\n').filter(l => l.trim() !== '');
  lines.forEach(line => {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `
      <span>${line}</span>
      <button onclick="copyText(this, '${line.replace(/'/g, "\\'")}')">Copy</button>
      <div class="popup">Copied!</div>
    `;
    output.appendChild(div);
  });
}

function copyText(button, text) {
  navigator.clipboard.writeText(text);
  const popup = button.parentElement.querySelector('.popup');
  popup.classList.add('show');
  setTimeout(() => popup.classList.remove('show'), 1200);
}
</script>
</body>
</html>
